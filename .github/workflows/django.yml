name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Show Python and flake8 info
      run: |
        echo "Python executable: $(which python)"
        python -V
        python -m pip --version
        python -m pip show flake8 || true
        python -m flake8 --version || true
    - name: Check PEP8 Formatting
      run: |
        chmod +x scripts/check_formatting.sh
        ./scripts/check_formatting.sh
    - name: Run Tests
      env:
        SECRET_KEY: 'django-insecure-test-key-for-ci-only'
      run: |
        python manage.py test
